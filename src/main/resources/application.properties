spring.application.name=typeahead

spring.datasource.url=jdbc:postgresql://localhost:5432/typeahead
spring.datasource.username=vini
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- write path (Stage 4) ---
typeahead.write.threshold=3
typeahead.write.sampling-rate=1.0
# 0.2 → random is below 0.2 only ~20% of the time → keep ~20%, drop ~80%.

# --- time decay (Stage 5) ---
typeahead.decay.factor=1.1
typeahead.decay.cron=0 0 3 * * *