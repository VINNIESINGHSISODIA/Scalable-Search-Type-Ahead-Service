<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Type-Ahead Demo</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
            display: flex; justify-content: center; padding-top: 12vh; }
        .box { width: 460px; }
        h1 { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; color: #94a3b8; }
        input { width: 100%; padding: 14px 16px; font-size: 1.1rem; border: 1px solid #334155;
            border-radius: 10px; background: #1e293b; color: #f8fafc; outline: none; box-sizing: border-box; }
        input:focus { border-color: #6366f1; }
        ul { list-style: none; margin: 6px 0 0; padding: 0; background: #1e293b;
            border: 1px solid #334155; border-radius: 10px; overflow: hidden; }
        li { padding: 11px 16px; cursor: pointer; }
        li:hover { background: #334155; }
        .hint { margin-top: 10px; font-size: .8rem; color: #64748b; }
    </style>
</head>
<body>
<div class="box">
    <h1>Search Type-Ahead</h1>
    <input id="q" type="text" placeholder="Start typing (suggestions from 3rd char)..." autocomplete="off" autofocus>
    <ul id="list"></ul>
    <div class="hint">Type ≥3 chars for suggestions. Click one or press Enter to record a search.</div>
</div>

<script>
    const input = document.getElementById('q');
    const list = document.getElementById('list');
    let timer;

    input.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(fetchSuggestions, 120);   // debounce
    });

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && input.value.trim()) recordSearch(input.value.trim());
    });

    async function fetchSuggestions() {
        const prefix = input.value.trim();
        if (prefix.length < 3) { list.innerHTML = ''; return; }
        const res = await fetch('/api/v1/suggestions?prefix=' + encodeURIComponent(prefix));
        const items = await res.json();
        list.innerHTML = items.map(s => `<li>${s}</li>`).join('');
        list.querySelectorAll('li').forEach(li =>
            li.onclick = () => { input.value = li.textContent; recordSearch(li.textContent); list.innerHTML = ''; });
    }

    async function recordSearch(query) {
        await fetch('/api/v1/frequency', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query })
        });
    }
</script>
</body>
</html>
<!--Let me break down these three lines — they implement **debouncing** (waiting until you pause typing before calling the API).-->

<!--```javascript-->
<!--input.addEventListener('input', () => {-->
<!--clearTimeout(timer);-->
<!--timer = setTimeout(fetchSuggestions, 120);-->
<!--});-->
<!--```-->

<!--**Line 1 — `input.addEventListener('input', () => {...})`**-->
<!--"Every time the input box's value changes (any character typed or deleted), run this function." The `'input'` event fires on *every single keystroke*.-->

<!--**Line 3 — `setTimeout(fetchSuggestions, 120)`**-->
<!--"Don't call `fetchSuggestions` right now — wait **120 milliseconds**, then call it." `setTimeout` schedules a function for later and returns a **timer ID**, which we store in `timer`.-->

<!--**Line 2 — `clearTimeout(timer)`**-->
<!--"Cancel the previously scheduled call (if one is still waiting)." This runs *before* scheduling a new one.-->

<!--**How they work together — the debounce:**-->

<!--Imagine you type "mic" quickly:-->

<!--```-->
<!--type 'm'  → clear (nothing to clear) → schedule call in 120ms  ⏱-->
<!--type 'i'  → CANCEL the 'm' call      → schedule NEW call in 120ms  ⏱ (restarts the clock)-->
<!--type 'c'  → CANCEL the 'i' call      → schedule NEW call in 120ms  ⏱ (restarts again)-->
<!--(you pause) → 120ms passes with no new keystroke → fetchSuggestions() finally runs ONCE-->
<!--```-->

<!--Each keystroke **cancels the pending call and restarts the 120ms clock**. The API only gets called when you **stop typing for 120ms**.-->

<!--**Why bother?**-->
<!--Without debounce, typing "microsoft" (9 letters fast) fires **9 API calls** in a fraction of a second — 8 of them instantly thrown away as you keep typing. That's wasted load on your server, Redis, and Postgres. With debounce, it fires **once** (or a couple of times if you type slowly). Every real search bar (Google, Amazon) does this.-->

<!--**The tradeoff — the 120 number:**-->
<!-- - **Too high** (say 500ms) → suggestions feel laggy; you've stopped typing but the dropdown hasn't caught up.-->
<!-- - **Too low** (say 20ms) → barely any batching, nearly one call per keystroke.-->
<!-- - **~100–150ms** is the sweet spot — feels instant to the user but still collapses rapid typing.-->

<!--So those three lines turn "fire on every keystroke" into "fire once the user pauses" — a small, standard, important optimization.-->
